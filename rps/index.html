<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMSI | 실시간 가위바위보</title>
<style>
/* 기존 홈페이지 디자인 시스템 재사용 */
:root{--bg:#0b0c12;--card:#171923;--line:#303344;--txt:#f5f5f8;--muted:#a8aabd;--accent:#b5ff6d;--danger:#ff8f8f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 80% 0%,#b5ff6d13,transparent 50%)}
header,main{max-width:720px;margin:auto;padding:0 24px}
header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-weight:900;letter-spacing:-1px;font-size:23px}
.logo span{color:var(--accent)}
header nav a{color:var(--muted);text-decoration:none;font-size:14px;margin-left:22px}
header nav a:hover{color:var(--accent)}
main{padding-top:40px;padding-bottom:80px}
h1.title{font-size:clamp(34px,7vw,52px);letter-spacing:-.04em;margin:10px 0 6px}
h1.title span{color:var(--accent)}
.subtitle{color:var(--muted);margin:0 0 32px;line-height:1.7}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px}
.card + .card{margin-top:18px}

/* 인증 폼 */
.auth-tabs{display:flex;gap:10px;margin-bottom:22px}
.auth-tab{flex:1;border:1px solid var(--line);background:#10131b;color:var(--muted);border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.auth-tab.active{border-color:var(--accent);color:var(--accent);background:#b5ff6d12}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:13px;color:var(--muted)}
.field input{background:#10131b;border:1px solid #434758;border-radius:12px;color:var(--txt);font:inherit;font-size:16px;padding:14px 16px;outline:none}
.field input:focus{border-color:var(--accent)}
.btn{border:0;border-radius:12px;background:var(--accent);color:#101b0a;font:inherit;font-weight:800;padding:15px 20px;cursor:pointer;width:100%;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:#303442;color:#fff}
.msg{min-height:20px;margin:14px 0 0;font-size:14px;line-height:1.5}
.msg.error{color:var(--danger)}
.msg.ok{color:var(--accent)}
.hint{color:var(--muted);font-size:12px;line-height:1.6;margin:10px 0 0}

/* 사용자 바 */
.userbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.userbar .who{display:flex;flex-direction:column;gap:3px}
.userbar .who b{color:var(--accent);font-size:18px}
.userbar .who small{color:var(--muted);font-size:12px}
.userbar .actions{display:flex;gap:10px}
.userbar .actions .btn{width:auto;padding:10px 16px;font-size:14px}

/* 전적 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.stat{background:#10131b;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--accent)}
.stat small{color:var(--muted);font-size:12px}

.hidden{display:none !important}

/* 게임 자리표시 */
.placeholder{text-align:center;color:var(--muted);padding:30px 10px;line-height:1.7}

/* 매칭 대기 */
.waiting{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 10px}
.waiting b{font-size:18px}
.waiting small{color:var(--muted);font-size:13px}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid #2a2e3c;border-top-color:var(--accent);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 게임 진행 */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:22px}
.vs-side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.vs-side small{color:var(--muted);font-size:12px}
.vs-side b{font-size:17px;overflow-wrap:anywhere}
.vs-pick{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 10px;transition:.2s}
.vs-pick.done{color:var(--accent);border-color:var(--accent);background:#b5ff6d12}
.vs-mid{display:flex;flex-direction:column;align-items:center}
.vs-mid small{color:var(--muted);font-size:11px}
.countdown{font-size:40px;font-weight:900;color:var(--accent);line-height:1;min-width:60px;text-align:center}
.countdown.urgent{color:var(--danger);animation:pulse .5s ease infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}

.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.choice{display:flex;flex-direction:column;align-items:center;gap:8px;background:#10131b;border:2px solid var(--line);border-radius:16px;padding:20px 8px;color:var(--txt);font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:.15s}
.choice span{font-size:40px;line-height:1}
.choice:hover:not(:disabled){border-color:var(--accent);transform:translateY(-3px)}
.choice.selected{border-color:var(--accent);background:#b5ff6d1f}
.choice:disabled{opacity:.45;cursor:not-allowed}

/* 결과 */
.result-banner{text-align:center;font-size:30px;font-weight:900;letter-spacing:-.02em;padding:14px 0 18px;animation:pop .35s ease}
.result-banner.win{color:var(--accent)}
.result-banner.lose{color:var(--danger)}
.result-banner.draw{color:#ffd86d}
.result-banner.void{color:var(--muted);font-size:22px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.result-vs{margin-bottom:10px}
.pick-emoji{font-size:52px;line-height:1.2}
.result-streak{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 22px;line-height:1.7}
.result-streak b{color:var(--accent)}

@media(max-width:560px){
  .stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat b{font-size:19px}
  .userbar{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<header>
  <div class="logo">TM<span>SI.</span></div>
  <nav><a href="../index.html">← 홈으로</a></nav>
</header>

<main>
  <h1 class="title">실시간 <span>가위바위보</span></h1>
  <p class="subtitle">로그인하고 다른 플레이어와 1:1로 대결하세요. 15초 안에 선택!</p>

  <!-- ===== 1) 비로그인: 인증 카드 ===== -->
  <section id="authCard" class="card">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" type="button">로그인</button>
      <button class="auth-tab" id="tabSignup" type="button">회원가입</button>
    </div>

    <form id="authForm">
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="6자 이상" minlength="6" required>
      </div>
      <!-- 회원가입 시에만 노출 -->
      <div class="field hidden" id="nicknameField">
        <label for="nickname">닉네임 (2~20자, 중복 불가)</label>
        <input id="nickname" type="text" maxlength="20" placeholder="게임에서 보일 이름" autocomplete="nickname">
      </div>
      <button class="btn" id="authSubmit" type="submit">로그인</button>
      <p class="msg" id="authMsg"></p>
    </form>
  </section>

  <!-- ===== 2) 로그인: 사용자 + 전적 + 게임 영역 ===== -->
  <section id="appCard" class="card hidden">
    <div class="userbar">
      <div class="who">
        <b id="userNick">—</b>
        <small id="userEmail">—</small>
      </div>
      <div class="actions">
        <button class="btn secondary" id="editNickBtn" type="button">닉네임 변경</button>
        <button class="btn secondary" id="logoutBtn" type="button">로그아웃</button>
      </div>
    </div>
    <p class="msg" id="appMsg"></p>
  </section>

  <section id="statsCard" class="card hidden">
    <div class="stats">
      <div class="stat"><b id="stGames">0</b><small>총 게임</small></div>
      <div class="stat"><b id="stWins">0</b><small>승</small></div>
      <div class="stat"><b id="stLosses">0</b><small>패</small></div>
      <div class="stat"><b id="stDraws">0</b><small>무</small></div>
      <div class="stat"><b id="stStreak">0</b><small>현재 연승</small></div>
      <div class="stat"><b id="stMaxStreak">0</b><small>최대 연승</small></div>
    </div>
  </section>

  <!-- ===== 게임 영역: 상태에 따라 하위 뷰 중 하나만 표시 ===== -->
  <section id="gameCard" class="card hidden">

    <!-- (idle) 매칭 시작 전 -->
    <div id="viewIdle">
      <div class="placeholder" style="padding-bottom:18px">
        준비되면 매칭을 시작하세요. 대기 중인 상대와 1:1로 연결됩니다.
      </div>
      <button class="btn" id="startMatchBtn" type="button">⚔️ 매칭 시작</button>
      <p class="msg" id="matchMsg"></p>
    </div>

    <!-- (waiting) 매칭 대기 중 -->
    <div id="viewWaiting" class="hidden">
      <div class="waiting">
        <div class="spinner" aria-hidden="true"></div>
        <b>상대를 찾는 중...</b>
        <small id="waitTimer">0초</small>
      </div>
      <button class="btn secondary" id="cancelMatchBtn" type="button">매칭 취소</button>
      <p class="msg" id="waitMsg"></p>
    </div>

    <!-- (playing) 게임 진행 -->
    <div id="viewPlaying" class="hidden">
      <div class="vs">
        <div class="vs-side">
          <small>나</small>
          <b id="meName">—</b>
          <span class="vs-pick" id="meStatus">선택 대기</span>
        </div>
        <div class="vs-mid">
          <div class="countdown" id="countdown">15</div>
          <small>초</small>
        </div>
        <div class="vs-side">
          <small>상대</small>
          <b id="oppName">—</b>
          <span class="vs-pick" id="oppStatus">선택 대기</span>
        </div>
      </div>

      <div class="choices" id="choices">
        <button class="choice" data-choice="rock"     type="button"><span>✊</span>바위</button>
        <button class="choice" data-choice="scissors" type="button"><span>✌️</span>가위</button>
        <button class="choice" data-choice="paper"    type="button"><span>✋</span>보</button>
      </div>

      <p class="msg" id="playMsg"></p>
    </div>

    <!-- (result) 게임 결과 -->
    <div id="viewResult" class="hidden">
      <div class="result-banner" id="resultBanner">—</div>
      <div class="vs result-vs">
        <div class="vs-side"><small id="rMeName">나</small><div class="pick-emoji" id="rMePick">—</div></div>
        <div class="vs-mid"><b style="font-size:22px;color:var(--muted)">VS</b></div>
        <div class="vs-side"><small id="rOppName">상대</small><div class="pick-emoji" id="rOppPick">—</div></div>
      </div>
      <div class="result-streak" id="resultStreak"></div>
      <button class="btn" id="rematchBtn" type="button">🔄 다시 매칭하기</button>
    </div>

  </section>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
