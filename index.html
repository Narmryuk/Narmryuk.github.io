<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>타이밍 홈런 더비</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081525;color:#f5f9ff;font-family:system-ui,'Malgun Gothic',sans-serif;display:flex;justify-content:center;min-height:100vh}main{width:min(960px,100%);padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:clamp(24px,4vw,38px)}.sub{color:#a8bdd1;margin:5px 0 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stat{background:#142940;border:1px solid #294b67;border-radius:12px;padding:12px;text-align:center}.stat small{color:#a8bdd1;display:block}.stat strong{font-size:clamp(18px,3vw,28px)}.field{position:relative;overflow:hidden;border:2px solid #355c79;border-radius:18px;background:#173f36;aspect-ratio:16/9;min-height:280px;max-height:530px;touch-action:manipulation;cursor:pointer}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;background:#061323cf;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.panel{max-width:520px}.panel h2{font-size:clamp(25px,5vw,44px);margin:0 0 10px}.panel p{line-height:1.65;color:#c7d7e6}.hidden{display:none!important}button{border:0;border-radius:12px;background:#ffca46;color:#142030;font-size:18px;font-weight:800;padding:13px 28px;cursor:pointer}button:hover{background:#ffdc7d}.controls{display:flex;justify-content:center;gap:12px;align-items:center;margin:16px 0;flex-wrap:wrap}.hint{color:#a9bfd3;text-align:center;font-size:14px}.log{background:#12273c;border-radius:14px;padding:14px;margin-top:16px}.log h3{margin:0 0 8px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border-radius:9px;background:#26415b;padding:7px 10px;font-weight:700;font-size:13px}.gold{color:#ffdf68}.result{min-height:26px;text-align:center;font-weight:800;font-size:20px;color:#ffe28a}@media(max-width:550px){main{padding:10px}.stats{gap:5px}.stat{padding:9px 3px}.field{aspect-ratio:4/5}.hint{font-size:12px}}
</style>
</head>
<body><main>
<header><div><h1>⚾ 타이밍 홈런 더비</h1><div class="sub">줄어드는 원이 공과 겹치는 순간, 스윙!</div></div><button id="restart">새 게임</button></header>
<div class="stats"><div class="stat"><small>타석</small><strong id="count">0 / 10</strong></div><div class="stat"><small>총 비거리</small><strong id="total">0 m</strong></div><div class="stat"><small>최장 비거리</small><strong id="best">0 m</strong></div><div class="stat"><small>홈런 (120m+)</small><strong id="homers">0</strong></div></div>
<div class="field" id="field"><canvas id="game"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="overlayTitle">READY TO BAT?</h2><p id="overlayText">투수의 투구 모션 후 공이 날아오고, 타자가 스윙합니다. 바깥쪽 원이 작아집니다.<br>원이 공 테두리와 정확히 겹칠 때 <b>스페이스바</b> 또는 <b>화면 터치</b>로 타격하세요.<br>총 10구, 비거리 합계로 승부!</p><button id="start">게임 시작</button></div></div></div>
<div class="controls"><button id="swing">⚾ 스윙! (SPACE)</button></div><div class="result" id="result" aria-live="polite"></div><div class="hint">PERFECT에 가까울수록 비거리 증가 · 너무 빠르거나 늦으면 짧은 타구 또는 헛스윙 · 홈런 기준 120m</div>
<section class="log"><h3>타격 기록</h3><div class="chips" id="history">아직 타격 기록이 없습니다.</div></section>
</main><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),field=document.getElementById('field');const $=id=>document.getElementById(id);
let W=800,H=450,phase='menu',shots=[],pitchStart=0,pitchDuration=1800,impactAt=0,animationStart=0,flight=null,nextAt=0,lastTime=0;const BALL_R=17,START_R=155;
function resize(){const rect=field.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);W=rect.width;H=rect.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
const bx=()=>W*.5,by=()=>H*.70;const pitcherX=()=>W*.5,pitcherY=()=>H*.40;function text(s,x,y,size=20,color='#fff',align='center'){ctx.fillStyle=color;ctx.font=`800 ${size}px system-ui`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function drawField(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#122d4b');g.addColorStop(.52,'#235b56');g.addColorStop(1,'#16513c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#377e50';ctx.beginPath();ctx.ellipse(W/2,H*.88,W*.68,H*.49,0,Math.PI,Math.PI*2);ctx.fill();ctx.strokeStyle='#f7e9b6';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx(),by());ctx.lineTo(W*.06,H*.28);ctx.moveTo(bx(),by());ctx.lineTo(W*.94,H*.28);ctx.stroke();ctx.fillStyle='#a47a55';ctx.beginPath();ctx.ellipse(bx(),by()+25,W*.17,H*.12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7f1d9';ctx.beginPath();ctx.moveTo(bx(),by()+8);ctx.lineTo(bx()+13,by()+1);ctx.lineTo(bx()+13,by()+12);ctx.lineTo(bx(),by()+19);ctx.lineTo(bx()-13,by()+12);ctx.lineTo(bx()-13,by()+1);ctx.closePath();ctx.fill();ctx.fillStyle='#ffffff12';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(bx(),by(),50+i*48,Math.PI*1.08,Math.PI*1.92);ctx.strokeStyle='#ffffff17';ctx.lineWidth=1;ctx.stroke()}text('⚾ HOME RUN DERBY',W/2,H*.12,Math.min(25,W*.045),'#e5f4ff')}
function drawBall(x,y,r){ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=14;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#d74750';ctx.lineWidth=2;for(let dir of [-1,1]){ctx.beginPath();ctx.arc(x+dir*r*.72,y,r*.68,-Math.PI*.4,Math.PI*.4,dir===-1);ctx.stroke()}ctx.restore()}
function limb(ax,ay,bx,by,width,color){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke()}
function person(x,y,scale,kind,progress=0){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);const isPitch=kind==='pitcher',skin='#e8b58c',uniform=isPitch?'#e6edf7':'#ffd451',dark=isPitch?'#253e64':'#263647';let wind=isPitch?Math.sin(Math.min(1,progress)*Math.PI*1.5):0;let swingAngle=!isPitch?progress:0;
// legs
limb(-10,3,-17+wind*9,36,10,dark);limb(10,3,19-wind*14,36,10,dark);limb(-17+wind*9,36,-22+wind*9,40,8,'#e9e9e9');limb(19-wind*14,36,25-wind*14,40,8,'#e9e9e9');
ctx.fillStyle=uniform;ctx.beginPath();ctx.moveTo(-17,-36);ctx.lineTo(17,-36);ctx.lineTo(14,6);ctx.lineTo(-14,6);ctx.closePath();ctx.fill();ctx.fillStyle=dark;ctx.fillRect(-14,0,28,8);
ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-48,12,0,Math.PI*2);ctx.fill();ctx.fillStyle=dark;ctx.fillRect(-12,-59,24,6);ctx.fillRect(-15,-56,27,4);
if(isPitch){limb(-14,-26,-24,-9,8,uniform);limb(-24,-9,-7,-15-wind*18,7,skin);limb(14,-26,26+wind*12,-19-wind*18,8,uniform);limb(26+wind*12,-19-wind*18,34+wind*25,-31+wind*35,7,skin);ctx.fillStyle='#744a32';ctx.beginPath();ctx.ellipse(-7,-15-wind*18,10,8,.3,0,Math.PI*2);ctx.fill()}else{const a=swingAngle*Math.PI*.95;limb(-14,-26,-26,-12,8,uniform);limb(-26,-12,-5,-22,7,skin);limb(14,-26,28,-14,8,uniform);limb(28,-14,8,-22,7,skin);ctx.save();ctx.translate(4,-23);ctx.rotate(-.85+a);limb(0,0,0,-70,7,'#a77543');limb(0,-70,0,-77,10,'#c79b62');ctx.restore()}
ctx.restore()}
function drawPlayers(now){const t=phase==='pitch'?Math.max(0,(now-pitchStart)/pitchDuration):0;const release=Math.min(1,t/.38);person(pitcherX(),pitcherY(),Math.max(.55,Math.min(1,W/850)), 'pitcher',phase==='pitch'?release:0);const sw=phase==='flight'?Math.min(1,(now-animationStart)/320):0;person(W*.72,H*.73,Math.max(.85,Math.min(1.55,W/670)),'batter',sw);}
function updateStats(){$('count').textContent=shots.length+' / 10';$('total').textContent=shots.reduce((a,s)=>a+s.distance,0)+' m';$('best').textContent=Math.max(0,...shots.map(s=>s.distance))+' m';$('homers').textContent=shots.filter(s=>s.distance>=120).length;$('history').innerHTML=shots.length?shots.map((s,i)=>`<span class="chip">${i+1}구 · ${s.distance}m ${s.distance>=120?'🏟️':s.distance===0?'❌':''}</span>`).join(''):'아직 타격 기록이 없습니다.'}
function showOverlay(title,body,button){$('overlayTitle').textContent=title;$('overlayText').innerHTML=body;$('start').textContent=button;$('overlay').classList.remove('hidden')}
function start(){shots=[];updateStats();$('result').textContent='';$('overlay').classList.add('hidden');newPitch(performance.now())}
function newPitch(now){phase='pitch';pitchDuration=1700+Math.random()*550;pitchStart=now;impactAt=pitchStart+pitchDuration;$('result').textContent=`${shots.length+1}번째 공이 날아옵니다!`}
function swing(){if(phase!=='pitch')return;const now=performance.now(),delta=(now-impactAt)/1000,err=Math.abs(delta);let distance=0,label='';if(err<=.045){distance=Math.round(145+Math.random()*26);label='PERFECT! 💥'}else if(err<=.11){distance=Math.round(118+Math.random()*27);label='GREAT! 🔥'}else if(err<=.20){distance=Math.round(78+Math.random()*43);label='GOOD!'}else if(err<=.33){distance=Math.round(20+Math.random()*65);label=delta<0?'너무 빠른 스윙!':'너무 늦은 스윙!'}else{distance=0;label='헛스윙!'}shots.push({distance,label,delta});updateStats();$('result').textContent=`${label} · ${distance}m${distance>=120?' · 홈런! 🏟️':''}`;phase='flight';animationStart=now;flight={distance,delta};nextAt=now+1800}
function finish(){phase='done';const total=shots.reduce((a,s)=>a+s.distance,0),home=shots.filter(s=>s.distance>=120).length;showOverlay('경기 종료! 🏆',`<b style="color:#ffdf68;font-size:27px">총 ${total.toLocaleString()}m</b><br>홈런 ${home}개 · 최장 ${Math.max(...shots.map(s=>s.distance))}m<br>다시 도전해서 기록을 갱신해 보세요!`,'다시 도전')}
function frame(now){lastTime=now;drawField();drawPlayers(now);const x=bx(),y=by();if(phase==='pitch'){const elapsed=now-pitchStart,t=elapsed/pitchDuration,travel=Math.max(0,Math.min(1,(t-.32)/.68)),ease=travel*travel*(3-2*travel),px=pitcherX()+(x-pitcherX())*ease,py=pitcherY()-H*.13*Math.sin(Math.PI*travel)+(y-pitcherY())*ease,r=BALL_R+(START_R-BALL_R)*Math.max(0,1-t);drawBall(px,py,Math.max(5,BALL_R*(.35+.65*travel)));ctx.beginPath();ctx.arc(x,y,Math.max(BALL_R,r),0,Math.PI*2);ctx.strokeStyle=t>.87?'#ffdb4e':'#7cddff';ctx.lineWidth=t>.87?5:3;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=13;ctx.stroke();ctx.shadowBlur=0;if(t>=1.30)swing()}else if(phase==='flight'){const t=Math.min((now-animationStart)/1300,1),dist=flight.distance;if(dist>0){const side=Math.sign(flight.delta||1),endX=x+side*Math.min(W*.37,dist*1.65),endY=H*.14-Math.min(60,dist*.3);const px=x+(endX-x)*t,py=y+(endY-y)*t-Math.sin(t*Math.PI)*H*.3;ctx.strokeStyle='#ffda6d88';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo((x+endX)/2,-H*.1,endX,endY);ctx.stroke();drawBall(px,py,Math.max(4,17*(1-t*.7)));text(dist+'m',x,H*.27,Math.min(52,W*.09),'#ffe082')}else{text('STRIKE!',x,H*.32,Math.min(52,W*.1),'#ff8585')}if(now>=nextAt){if(shots.length>=10)finish();else newPitch(now)}}else{drawBall(x,y,BALL_R);ctx.beginPath();ctx.arc(x,y,BALL_R,0,Math.PI*2);ctx.strokeStyle='#ffda61';ctx.lineWidth=3;ctx.stroke()}requestAnimationFrame(frame)}
$('start').addEventListener('click',e=>{e.stopPropagation();start()});$('restart').addEventListener('click',start);$('swing').addEventListener('click',swing);field.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;swing()});window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(phase==='menu'||phase==='done')start();else swing()}});updateStats();requestAnimationFrame(frame);
})();
</script></body></html>
